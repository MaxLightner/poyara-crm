name: Android debug APK

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: poyara-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache/restore@v4
        id: razavi-map-cache
        with:
          path: app/src/main/assets/maps/razavi.map
          key: razavi-khorasan-v1-${{ hashFiles('tools/build_razavi_map.sh', 'tools/create_razavi_poly.py') }}
      - name: Build bundled Razavi Khorasan offline map
        if: steps.razavi-map-cache.outputs.cache-hit != 'true'
        run: bash tools/build_razavi_map.sh
      - uses: actions/cache/save@v4
        if: always() && steps.razavi-map-cache.outputs.cache-hit != 'true' && hashFiles('app/src/main/assets/maps/razavi.map') != ''
        with:
          path: app/src/main/assets/maps/razavi.map
          key: razavi-khorasan-v1-${{ hashFiles('tools/build_razavi_map.sh', 'tools/create_razavi_poly.py') }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: poyara-crm-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
