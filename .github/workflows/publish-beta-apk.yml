name: Publish downloadable Poyara beta APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-beta-apk.yml'
      - 'app/build.gradle.kts'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: vars.POYARA_CLOUD_BACKEND_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build tested APK
        env:
          POYARA_CENTRAL_AGENT_URL: ${{ vars.POYARA_CENTRAL_AGENT_URL }}
          POYARA_APP_ACCESS_KEY: ${{ secrets.POYARA_APP_ACCESS_KEY }}
        run: |
          test -n "$POYARA_CENTRAL_AGENT_URL"
          test -n "$POYARA_APP_ACCESS_KEY"
          gradle --no-daemon :app:assembleDebug
      - name: Prepare directly installable APK
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          version="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"/\1/p' app/build.gradle.kts | head -1)"
          test -n "$version"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "POYARA-CRM-$version.apk"
          sha256sum "POYARA-CRM-$version.apk"
      - name: Publish public GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v$APP_VERSION"
          apk="POYARA-CRM-$APP_VERSION.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" \
              --title "POYARA CRM $APP_VERSION (Android beta)" \
              --notes "Direct Android APK for version $APP_VERSION. This is a debug-signed testing build. Back up your existing CRM data before installation. Do not uninstall your current app unless you have a verified backup. Installation over earlier builds may fail because their debug signing keys differ." \
              --prerelease
          fi
